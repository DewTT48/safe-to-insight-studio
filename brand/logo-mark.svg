<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Safe-to-Insight Studio mark</title>
  <desc id="desc">A flowing letter S that turns raw data into a safe, usable output.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="448" y2="472" gradientUnits="userSpaceOnUse">
      <stop stop-color="#102D4D"/>
      <stop offset="1" stop-color="#071A2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="328" y1="286" x2="430" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38D6C2"/>
      <stop offset="1" stop-color="#0F9D8A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#03101C" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="38" y="38" width="436" height="436" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="4"/>

  <circle cx="118" cy="158" r="17" fill="#38D6C2"/>
  <circle cx="118" cy="250" r="12" fill="#B8C8D8" fill-opacity=".72"/>
  <circle cx="118" cy="342" r="9" fill="#B8C8D8" fill-opacity=".42"/>

  <path d="M118 158H316c35 0 58 19 58 48s-23 48-58 48H202c-35 0-58 19-58 48s23 48 58 48h174"
        fill="none" stroke="#F8FCFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M344 318l46 32-46 32" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M389 101l8 19 19 8-19 8-8 19-8-19-19-8 19-8 8-19Z" fill="#38D6C2"/>
  <circle cx="431" cy="179" r="7" fill="#E8FBF8" fill-opacity=".9"/>
